[env]
platform = ststm32@19.3.0
board = bluepill_f103c8
board_upload.maximum_size = 65536
board_upload.maximum_ram_size = 20480
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_src_flags = -Wall -Wextra -Werror
build_flags = -Iinclude -DHSE_VALUE=8000000UL

[env:achizitie]
build_flags = ${env.build_flags} -DNODE_SENSOR=1

[env:monitor]
build_flags = ${env.build_flags} -DNODE_SENSOR=0
